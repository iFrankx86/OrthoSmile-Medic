server:
  port: ${PORT:8080}

spring:
  application:
    name: orthosmille-medic-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orthosmille_medic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.orthosmille.medic: DEBUG
